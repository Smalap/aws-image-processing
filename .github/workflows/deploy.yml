# .github/workflows/deploy.yml
#
# CI/CD for the serverless image processor.
# Deploys src/lambda_function.py to AWS Lambda on every push to main.
#
# Authenticates with GitHub OIDC — no AWS access keys stored in GitHub Secrets.
# GitHub requests a short-lived token from AWS STS at run time, so there is
# no long-lived credential to leak.
#
# One-time AWS setup is documented at the bottom of this file.

name: Deploy Image Processor

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
  workflow_dispatch:      # lets you trigger manually from the Actions tab

env:
  AWS_REGION: us-east-1
  FUNCTION_NAME: image-processor
  PYTHON_VERSION: '3.12'

permissions:
  id-token: write         # required for OIDC
  contents: read

jobs:
  # ------------------------------------------------------------------
  # Runs on PRs and pushes. Blocks deploy if anything here fails.
  # ------------------------------------------------------------------
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check src/

      - name: Verify the handler imports and compiles
        env:
          DEST_BUCKET: dummy-bucket-for-import-check
        run: |
          python -c "import sys; sys.path.insert(0, 'src'); import lambda_function; print('Handler imports cleanly')"

      - name: Run unit tests
        env:
          DEST_BUCKET: dummy-bucket-for-import-check
          AWS_DEFAULT_REGION: ${{ env.AWS_REGION }}
        run: |
          if [ -d tests ] && ls tests/test_*.py >/dev/null 2>&1; then
            pytest tests/ -v
          else
            echo "No pytest files found — skipping. Add tests/test_handler.py to enable."
          fi

  # ------------------------------------------------------------------
  # Only runs on pushes to main, and only if `test` passed.
  # ------------------------------------------------------------------
  deploy:
    name: Deploy to Lambda
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Package function
        run: |
          cd src
          zip -r ../function.zip lambda_function.py
          cd ..
          echo "Package size: $(du -h function.zip | cut -f1)"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update function code
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.FUNCTION_NAME }} \
            --zip-file fileb://function.zip \
            --publish

      - name: Wait for update to settle
        run: |
          aws lambda wait function-updated \
            --function-name ${{ env.FUNCTION_NAME }}

      - name: Smoke test the deployed function
        run: |
          aws lambda invoke \
            --function-name ${{ env.FUNCTION_NAME }} \
            --payload '{"Records":[]}' \
            --cli-binary-format raw-in-base64-out \
            response.json
          echo "Response:"
          cat response.json
          grep -q '"statusCode": 200' response.json || {
            echo "Smoke test failed"; exit 1;
          }

      - name: Summary
        run: |
          echo "### Deployed \`${{ env.FUNCTION_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Region: \`${{ env.AWS_REGION }}\`" >> $GITHUB_STEP_SUMMARY

# ====================================================================
# ONE-TIME AWS SETUP FOR OIDC
# ====================================================================
#
# 1. Create the identity provider (only once per AWS account — if you
#    already did this for the resume project, skip it):
#
#      IAM -> Identity providers -> Add provider -> OpenID Connect
#        Provider URL: https://token.actions.githubusercontent.com
#        Audience:     sts.amazonaws.com
#
# 2. Create a role `github-actions-image-processor` with this trust policy,
#    replacing ACCOUNT_ID (188289743200) and YOUR_GITHUB_USERNAME:
#
#    {
#      "Version": "2012-10-17",
#      "Statement": [{
#        "Effect": "Allow",
#        "Principal": {
#          "Federated": "arn:aws:iam::188289743200:oidc-provider/token.actions.githubusercontent.com"
#        },
#        "Action": "sts:AssumeRoleWithWebIdentity",
#        "Condition": {
#          "StringEquals": {
#            "token.actions.githubusercontent.com:aud": "sts.amazonaws.com"
#          },
#          "StringLike": {
#            "token.actions.githubusercontent.com:sub":
#              "repo:YOUR_GITHUB_USERNAME/aws-image-processing:ref:refs/heads/main"
#          }
#        }
#      }]
#    }
#
#    The StringLike condition is the security boundary: it scopes the role to
#    the main branch of this one repo. Without it, any GitHub repo anywhere
#    could assume your role.
#
# 3. Attach this permission policy to the role:
#
#    {
#      "Version": "2012-10-17",
#      "Statement": [{
#        "Effect": "Allow",
#        "Action": [
#          "lambda:UpdateFunctionCode",
#          "lambda:GetFunction",
#          "lambda:GetFunctionConfiguration",
#          "lambda:InvokeFunction",
#          "lambda:PublishVersion"
#        ],
#        "Resource": "arn:aws:lambda:us-east-1:188289743200:function:image-processor"
#      }]
#    }
#
# 4. In GitHub: Settings -> Secrets and variables -> Actions -> New secret
#      Name:  AWS_DEPLOY_ROLE_ARN
#      Value: arn:aws:iam::188289743200:role/github-actions-image-processor
